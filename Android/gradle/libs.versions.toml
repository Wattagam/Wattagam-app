[versions]
agp = "9.3.3"
kotlin = "2.4.10"
composeBom = "2026.09.00"
activity = "1.13.0"
navigation = "1.2.1"
serialization = "1.9.0"
androidxTest = "1.7.0"
androidxJunit = "1.3.0"
espresso = "3.7.0"
playServicesLocation = "21.4.0"
kakao = "2.26.0"
junit = "4.13.2"
camerax = "1.6.2"
exifinterface = "1.4.2"
kakaoMap = "2.15.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
navigation-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation" }
navigation-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation" }
serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }

test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
test-junit4 = { module = "junit:junit", version.ref = "junit" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
kakao-user = { module = "com.kakao.sdk:v2-user", version.ref = "kakao" }
kakao-map = { module = "com.kakao.maps.open:android", version.ref = "kakaoMap" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
