spring.application.name=backend
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# 고유키 오류 원문에 포함되는 카카오 사용자 식별자를 일반 로그에 남기지 않는다.
logging.level.org.hibernate.orm.jdbc.error=OFF

app.auth.jwt.secret=${AUTH_JWT_SECRET:}
app.auth.jwt.expires-in=3600
app.auth.kakao.app-id=${KAKAO_APP_ID:0}

app.storage.oci.enabled=${OCI_STORAGE_ENABLED:false}
app.storage.oci.region=${OCI_STORAGE_REGION:}
app.storage.oci.namespace=${OCI_STORAGE_NAMESPACE:}
app.storage.oci.bucket=${OCI_STORAGE_BUCKET:}
app.storage.oci.config-file=${OCI_CONFIG_FILE:}
app.storage.oci.profile=${OCI_CONFIG_PROFILE:DEFAULT}

app.visit.max-accuracy-meters=20
app.visit.max-age=60s
app.visit.future-tolerance=10s
